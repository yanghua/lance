syntax = "proto3";

package lance.recluster;

import "table.proto";

// Versioned, opaque protocol used by distributed clustering coordinators.
message Plan {
  uint32 format_version = 1;
  lance.table.UUID plan_id = 2;
  string dataset_uri = 3;
  uint64 read_version = 4;
  uint64 clustering_generation = 5;
  lance.table.ClusteringAlgorithm algorithm = 6;
  repeated string columns = 7;
  repeated Group groups = 8;
  // BLAKE3 digest of the complete schema, including schema and field metadata.
  bytes schema_digest = 9;
  // Layout groups below this live-row count remain eligible for incremental merging.
  uint64 target_rows_per_fragment = 10;
}

message Group {
  // Unique execution identity within the plan.
  lance.table.UUID group_id = 1;
  // Complete metadata for the fragments atomically replaced by this group.
  repeated lance.table.DataFragment source_fragments = 2;
  // Expected live rows after applying deletion files to the source fragments.
  uint64 expected_live_rows = 3;
}

message Result {
  uint32 format_version = 1;
  lance.table.UUID plan_id = 2;
  lance.table.UUID group_id = 3;
  // Digest of the exact finalized model used to generate clustering keys.
  bytes model_digest = 4;
  // IDs must exactly match the selected group's source fragments in plan order.
  repeated uint64 source_fragment_ids = 5;
  // Staged, uncommitted base-data fragments written by one successful attempt.
  repeated lance.table.DataFragment new_fragments = 6;
  uint64 input_rows = 7;
  uint64 output_rows = 8;
  // Order-independent digest of the source row addresses carried through shuffle.
  bytes output_row_digest = 9;
}
